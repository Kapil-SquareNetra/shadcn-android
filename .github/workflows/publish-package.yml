name: Publish GitHub Package

on:
  workflow_dispatch:

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment version
        id: version
        run: |
          set -euo pipefail
          current="$(sed -n 's/^shadcn.version=//p' gradle.properties)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected semver in shadcn.version, got: $current"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          sed -i "s/^shadcn.version=.*/shadcn.version=${next}/" gradle.properties
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped shadcn.version from ${current} to ${next}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :shadcn-ui:publishReleasePublicationToGitHubPackagesRepository --no-daemon

      - name: Commit version and tag
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump shadcn-ui to ${version}"
          git tag "v${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${version}"
